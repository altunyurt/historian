<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="search-row">
        <div id="search-input-wrap">
          <input type="text" id="search-input" placeholder="Search history..." />
          <button id="search-clear" aria-label="Clear search">✕</button>
        </div>
        <button id="delete-btn" class="danger">Delete Selected</button>
      </div>
      <div class="filter-row">
        <input type="date" id="date-start" />
        <span>to</span>
        <input type="date" id="date-end" />
        <button id="clear-filters">Clear Filters</button>
      </div>
      <div id="match-info"></div>
      <div class="select-row">
        <input type="checkbox" id="select-all" />
        <label for="select-all">Select All</label>
        <input type="checkbox" id="dry-run" />
        <label for="dry-run">Dry Run</label>
      </div>
    </header>

    <main id="history-container">
      <ul id="history-list"></ul>
    </main>
    <div id="loading-overlay">
      <div class="overlay-content">
        <div id="status-text">Deleting...</div>
        <pre id="plan-output"></pre>
        <button id="cancel-delete-btn" class="secondary">Cancel</button>
      </div>
    </div>

    <div id="context-menu">
      <button id="menu-open" type="button">Open in New Tab</button>
      <button id="menu-copy" type="button">Copy URL</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
